# Offline RAG Assistant - local infrastructure
# Start:  docker compose up -d
# Stop:   docker compose down
#
# Ollama runs natively on the host (Windows) for now and is reached at
# http://localhost:11434. It will be added to this file in week 3 for
# one-command deployment on other machines.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only: the database is not reachable from the network
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume: data survives container restarts and re-creation
      - pgdata:/var/lib/postgresql/data
      # SQL files in db/init run automatically on the FIRST start of an empty database
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
